spring.application.name=apigateway
server.port=8080

# Register with Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL}

# ---------- Auth Service ----------
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# ---------- Trip Service ----------
spring.cloud.gateway.server.webflux.routes[1].id=trip-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://TRIP-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/trips/**

# ---------- Ai Service ----------
spring.cloud.gateway.server.webflux.routes[2].id=ai-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://AI-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/ai/**

## ---------- Trip Images ----------
spring.cloud.gateway.server.webflux.routes[3].id=trip-file-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://TRIP-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/files/**

eureka.instance.prefer-ip-address=true
